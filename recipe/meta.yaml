{% set version = "5.16.1" %}

package:
  name: traitlets
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/traitlets/traitlets-{{ version }}.tar.gz
  sha256: ed900c2b631aa3a112811139fa97b8d2c3bad5e989656bba4b7e52c7852c18c1

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling >=1.5
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - traitlets
    - traitlets.config
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest tests

about:
  home: https://traitlets.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Configuration system for Python applications
  description: |
    Traitlets is a framework that lets Python classes have attributes with
    type checking, dynamically calculated default values, and "on change"
    callbacks.
  dev_url: https://github.com/ipython/traitlets
  doc_url: https://traitlets.readthedocs.org/en/stable/

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
    - minrk
    - SylvainCorlay
    - ocefpaf
    - Carreau
    - takluyver
    - rmorshea
    - blink1073
    - zsailer
